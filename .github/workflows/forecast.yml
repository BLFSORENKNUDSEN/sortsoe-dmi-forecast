name: Test Sortsoe STAC forecast

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/fetch_stac_probe.py"
      - ".github/workflows/forecast.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          python -m pip install --upgrade pip
          pip install eccodes

      - name: Probe latest DMI HARMONIE GRIB
        run: python scripts/fetch_stac_probe.py

      - name: Commit probe JSON
        run: |
          if git diff --quiet -- data/stac_probe.json; then
            echo "No probe change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stac_probe.json
          git commit -m "Update Sortsoe STAC probe"
          git push
