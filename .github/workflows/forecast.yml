name: Update Denmark STAC forecast

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/fetch_stac_denmark.py"
      - ".github/workflows/forecast.yml"
  schedule:
    - cron: "25 2,5,8,11,14,17,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: denmark-stac-forecast
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          python -m pip install --upgrade pip
          pip install eccodes numpy

      - name: Build Denmark DMI HARMONIE forecast grid
        run: python scripts/fetch_stac_denmark.py

      - name: Commit forecast data
        run: |
          if [ -z "$(git status --porcelain -- data/sortsoe.json data/grid)" ]; then
            echo "No forecast change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sortsoe.json data/grid
          git commit -m "Update Denmark STAC forecast"

          # Workflowet kan tage et stykke tid. Hvis main er blevet opdateret
          # imens, lægges forecast-committet oven på den nyeste main før push.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed because main changed again. Retrying..."
            sleep 3
          done

          echo "Could not push forecast after 3 attempts"
          exit 1
