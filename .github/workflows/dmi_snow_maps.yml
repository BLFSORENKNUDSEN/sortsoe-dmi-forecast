name: Update DMI HARMONIE snow depth maps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_harmonie_snow_maps.py"
      - ".github/workflows/dmi_snow_maps.yml"
  schedule:
    - cron: "45 2,5,8,11,14,17,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: dmi-harmonie-snow-maps
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          python -m pip install --upgrade pip
          pip install eccodes numpy matplotlib cartopy

      - name: Generate DMI HARMONIE snow depth maps
        run: python scripts/generate_harmonie_snow_maps.py

      - name: Commit snow maps
        run: |
          if [ -z "$(git status --porcelain -- data/dmi_snow)" ]; then
            echo "No snow map change"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dmi_snow
          git commit -m "Update DMI HARMONIE snow depth maps"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed because main changed again. Retrying..."
            sleep 3
          done

          echo "Could not push snow maps after 3 attempts"
          exit 1
